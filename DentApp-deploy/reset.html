<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentApp reset cache</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    main {
      width: min(560px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #666; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Obnovujem DentApp</h1>
    <p>Mažem lokálnu aplikačnú cache a načítavam najnovšiu verziu.</p>
  </main>
  <script>
    async function resetDentAppCache() {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      window.location.replace("/?v=reset-20260814");
    }
    resetDentAppCache().catch(() => {
      window.location.replace("/?v=reset-20260814");
    });
  </script>
</body>
</html>
